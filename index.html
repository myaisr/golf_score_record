<style>

.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.hole-number{display:flex;align-items:baseline;gap:8px}.hole-number strong{font-size:34px;line-height:1.1;letter-spacing:-.035em}.hole-number small{color:#7b9188;font-weight:800}.par-row{display:flex;gap:6px;align-items:center}.par-row-label{font-size:11px;color:#677f73;margin-right:7px;font-weight:900}.par-choice{width:46px;height:43px;border-radius:11px;background:#f1f5f1;border:1px solid #dce6df;color:#426252;font-weight:800}.par-choice.active{background:#d6f4e4;border-color:#53b78f;color:#0b6f51}

ntent:space-between;gap:4px;margin-top:10px}.ob-controls button{height:38px;width:38px;border-radius:9px;background:#f2f2e9;border:1px solid #e1e2d8;font-size:21px;color:#5e6055}.ob-controls strong{font-size:24px}.notice{margin-top:14px;padding:12px 14px;border-left:3px solid #b1d8bb;background:#f3f8f3;border-radius:7px;color:#5a7265;font-size:12px;line-height:1.7}.navigation{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.nav-button{border-radius:12px;border:1px solid #d5e2d9;background:white;color:#246747;padding:13px 18px;font-weight:850;font-size:13px}.nav-button.primary,.action.primary{background:#177d5e;border-color:#177d5e;color:white}.nav-button:last-child{margin-left:auto}
.result-hero{background:#123c32;color:white;border-radius:20px;padding:23px 24px;margin-bottom:18px}.result-hero .muted{color:#b3ddca;font-size:12px;letter-spacing:.06em;font-weight:700}.result-score{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-top:9px}.result-score .big{font-size:clamp(65px,13vw,105px);line-height:1;font-weight:850;letter-spacing:-.07em}.result-score .unit{font-size:18px;letter-spacing:0;font-weight:500;margin-left:10px}.status-pill{border:1px solid #91b9a6;background:rgba(255,255,255,.1);border-radius:50px;padding:9px 13px;font-size:13px;font-weight:900;white-space:nowrap}.result-hero p{font-size:12px;color:#b9dccc;margin:17px 0 0;line-height:1.6}.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:17px}.kpi{background:white;border:1px solid #e0e8e1;border-radius:14px;padding:14px}.kpi b{display:block;font-size:23px;margin:5px 0}.kpi span{font-size:11px;color:#627b6b}.kpi .target{display:block;font-size:10px;color:#80978b}.half-section{background:white;border:1px solid #dfebe3;border-radius:17px;padding:17px;margin-bottom:12px}.half-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.half-head h3{margin:0;font-size:17px}.half-head strong{font-size:19px}.matrix{display:grid;grid-template-columns:72px repeat(9,minmax(0,1fr));gap:3px;align-items:stretch}.matrix-label{display:grid;align-items:center;font-size:10px;color:#6d857a;font-weight:750;padding:7px 2px}.matrix-cell{display:grid;place-items:center;min-width:0;border-radius:6px;background:#f4f7f4;padding:8px 0;font-size:11px;font-weight:750}.matrix-cell.head{background:#e7f2ea;color:#236a4e}.matrix-cell.score{background:#e0f3e6;color:#176d4e;font-weight:900}.matrix-cell.bad{background:#fff0e9;color:#af612e}.matrix-cell.muted{color:#a4b1aa}.breakdowns{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px}.breakdown{border-radius:15px;background:#fff;border:1px solid #dfe8e1;padding:15px}.breakdown h3{margin:0 0 12px;font-size:14px}.breakdown .bar{display:flex;justify-content:space-between;gap:7px;padding:5px 0;font-size:12px}.breakdown .bar b{font-weight:900}.breakdown .bar span{color:#6a8273}.actions{display:flex;gap:9px;flex-wrap:wrap}.action{padding:13px 15px;border:1px solid #dce7df;background:white;color:#225d44;border-radius:12px;font-size:13px;font-weight:900}.action.primary{flex:1}.subnote{font-size:11px;color:#6f8277;line-height:1.7;margin:10px 0 0}.small-warn{border-radius:11px;background:#fff6ec;border:1px solid #f2debd;padding:11px 13px;color:#91612e;font-size:12px;line-height:1.6;margin-top:14px}.footer-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding:13px 0;color:#809184;font-size:11px}.quiet-link{border:0;background:transparent;color:#637c6d;text-decoration:underline;font-size:12px}.empty-value{color:#a4b6aa}
.overlay{position:fixed;inset:0;background:rgba(8,32,24,.85);z-index:10;display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}.overlay-inner{max-width:640px;width:100%}.overlay-head{display:flex;align-items:center;justify-content:space-between;color:white;margin-bottom:12px;gap:10px}.overlay-head h2{font-size:17px;margin:0}.overlay-head p{font-size:11px;color:#c5d9cb;margin:4px 0 0}.overlay-head button{border-radius:11px;border:1px solid #9fc2ac;background:rgba(255,255,255,.16);color:white;font-weight:800;padding:10px 16px}.overlay img{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 16px 44px #06180b}.overlay-footer{display:flex;gap:9px;margin-top:12px}.overlay-footer a{flex:1;text-decoration:none;text-align:center;background:#dcf4e3;color:#123e2f;padding:14px;border-radius:10px;font-size:13px;font-weight:900}.overlay-footer p{color:#c7ddce;font-size:11px;line-height:1.6;margin:0;flex:2}
@media(max-width:620px){.shell{padding:0 12px}.surface{padding:16px;border-radius:16px}.masthead{padding-bottom:23px}.mast-stats{gap:7px}.mast-stat{padding:11px 12px;min-width:0}.mast-stat b{font-size:20px}.hole-grid{gap:4px}.hole-tile{font-size:12px;border-radius:8px}.meta-grid{grid-template-columns:1fr 1fr}.par-row{gap:4px}.par-choice{width:38px;height:38px}.kpi-grid{gap:6px}.kpi{padding:11px 8px}.kpi b{font-size:20px}.kpi span{font-size:10px}.matrix{grid-template-columns:58px repeat(9,minmax(0,1fr));gap:2px}.matrix-label{font-size:9px}.matrix-cell{font-size:10px;padding:8px 0}.breakdowns{gap:8px}.breakdown{padding:12px}.result-hero{padding:19px 18px}.result-score .big{font-size:75px}}
@media(max-width:355px){.hole-tile{font-size:11px}.matrix{grid-template-columns:51px repeat(9,minmax(0,1fr))}.matrix-cell{font-size:9px}.par-choice{width:34px}.kpi b{font-size:17px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .12s ease,transform .12s ease}button:active{transform:scale(.97)}}
</style>
<style>
.compact-top{margin:12px 0}.compact-meta{display:grid;grid-template-columns:130px 1fr;gap:7px}.compact-meta input{min-width:0;width:100%;border:1px solid #d6e4d9;border-radius:10px;padding:9px;background:white;font-size:13px}.compact-status{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;color:#496e5a;font-size:12px}.compact-status strong{font-size:19px;color:#123d2d}.compact-editor{padding:13px!important}.compact-heading{display:flex;align-items:center;gap:8px;justify-content:space-between}.compact-arrow{font-size:28px;border:0;background:#eaf2ec;border-radius:10px;width:38px;height:49px;color:#184f39}.compact-hole{display:flex;align-items:center;gap:12px}.compact-hole>b{font-size:30px}.compact-hole span{display:flex;align-items:center;gap:4px;font-size:11px}.mini-par{border:1px solid #cddfd2;border-radius:7px;background:white;padding:7px 8px}.mini-par.active{background:#155d42;color:white}.compact-score{text-align:center;margin-left:auto}.compact-score b{display:block;font-size:27px;line-height:1}.compact-score small{font-size:11px;color:#577364}.compact-progress{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:2px;margin:12px 0 17px}.progress-dot{border:0;border-radius:4px;padding:6px 0;background:#e8efea;font-size:8px;color:#587163}.progress-dot.done{background:#c4e2d0;color:#15583b}.progress-dot.current{background:#146c4c;color:white}.compact-counter{margin:0 0 14px}.compact-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}.compact-label strong{font-size:19px}.compact-choices{display:flex;gap:5px}.compact-choices button{flex:1;min-width:0;border:1px solid #d5e3d9;border-radius:9px;background:#f5f8f5;padding:12px 0;font-weight:800;font-size:17px;color:#315744}.compact-choices button.active{background:#146b4a;color:white;border-color:#146b4a}.compact-choices button:disabled{opacity:.35}.compact-choices .compact-plus{flex:.8;background:#e9f2ec}.compact-extras{border-top:1px solid #e2ebe4;padding-top:10px}.compact-toggle{width:100%;border:1px solid #cbded0;background:#f3f8f4;border-radius:9px;padding:10px;color:#2d5e43;font-weight:700}.compact-toggle.active{background:#d3efde}.compact-ob{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:10px 0;font-size:12px}.compact-ob button{border:1px solid #d4e1d7;border-radius:8px;background:white;padding:8px 10px;font-size:16px}.compact-ob b{min-width:15px;text-align:center}.compact-next{width:100%;border:0;border-radius:12px;background:#146b4a;color:white;font-size:16px;font-weight:800;padding:15px}.compact-hint{font-size:10px;color:#647c6b;line-height:1.5;margin:8px 0 0}
@media(max-width:370px){.compact-choices button{font-size:15px;padding:11px 0}.compact-hole>b{font-size:25px}.compact-hole{gap:5px}.compact-arrow{width:30px}.compact-ob{gap:3px}.compact-ob button{padding:7px}}
</style></head>
<body>
<div id="app"></div><div id="overlay-root"></div>
<script>
(()=>{
'use strict';
const KEY='roundnote-golf-v1';
const blank=()=>({par:4,long:null,short:null,putts:null,obTee:0,obLater:0,direct:false});
const pad=n=>String(n).padStart(2,'0');
const today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const initial=()=>({date:today(),place:'',holes:Array.from({length:18},blank),active:0,view:'input'});
const finite=n=>typeof n==='number'&&Number.isFinite(n);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=initial();
try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.holes)&&v.holes.length===18){state={...initial(),date:typeof v.date==='string'?v.date:today(),place:typeof v.place==='string'?v.place.slice(0,100):'',active:Number.isInteger(v.active)?Math.max(0,Math.min(17,v.active)):0,holes:v.holes.map(h=>({...blank(),par:[3,4,5].includes(h.par)?h.par:4,long:finite(h.long)?h.long:null,short:finite(h.short)?h.short:null,putts:finite(h.putts)?h.putts:null,obTee:finite(h.obTee)?h.obTee:0,obLater:finite(h.obLater)?h.obLater:0,direct:!!h.direct}))};}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...state,view:'input'}));}catch(e){}};
const score=h=>[h.long,h.short,h.putts].every(finite)?h.long+h.short+h.putts:null;
const onCount=h=>(finite(h.long)&&finite(h.short))?h.long+h.short:null;
const bogeyOn=h=>finite(onCount(h))?onCount(h)<=h.par-1:null;
const sgn=n=>n>0?'+'+n:String(n);
const fmt=n=>finite(n)?String(n):'—';
const sums=arr=>({score:arr.reduce((n,h)=>n+(score(h)??0),0),long:arr.reduce((n,h)=>n+(h.long??0),0),short:arr.reduce((n,h)=>n+(h.short??0),0),putts:arr.reduce((n,h)=>n+(h.putts??0),0),teeOB:arr.reduce((n,h)=>n+h.obTee,0),lateOB:arr.reduce((n,h)=>n+h.obLater,0),par:arr.reduce((n,h)=>n+h.par,0),done:arr.filter(h=>score(h)!==null).length,bon:arr.filter(h=>bogeyOn(h)===true).length,direct:arr.filter(h=>h.direct).length});
const all=()=>sums(state.holes);
const elem=document.getElementById('app');
function header(){let x=all();return `<header class="masthead"><div class="shell"><div class="brand"><span class="brand-icon">↗</span>ROUNDNOTE <span style="opacity:.35">/</span> GOLF LOG</div><h1>1ホールずつ、迷わず記録。</h1><p class="intro">残り50yまで・アプローチ・パットを分けて、スコアの原因を見える化。</p><div class="mast-stats"><div class="mast-stat"><b>${x.done}<span style="display:inline;font-size:13px;color:#b8dac9"> / 18 H</span></b><span>入力完了</span></div><div class="mast-stat"><b>${x.done?x.score:'—'}<span style="display:inline;font-size:13px;color:#b8dac9"> ${x.done?'打':''}</span></b><span>入力済みホールの合計</span></div><div class="mast-stat"><b>${x.teeOB+x.lateOB}<span style="display:inline;font-size:13px;color:#b8dac9"> 回</span></b><span>OB 合計</span></div></div></div></header>`}
function render(){let x=all();elem.innerHTML=header()+`<div class="shell"><nav class="tabs" aria-label="画面切替"><button class="tab ${state.view==='input'?'active':''}" data-view="input">✎ 記録する</button><button class="tab ${state.view==='result'?'active':''}" data-view="result">▦ 集計・画像保存</button></nav>${state.view==='input'?inputView():resultView()}<footer class="footer-row"><span>ROUNDNOTE — データはこのブラウザ内に自動保存</span><button class="quiet-link" data-action="reset">新しいラウンドを始める</button></footer></div>`;}
function inputView(){let h=state.holes[state.active],s=score(h),x=all();return `<section class="compact-top"><div class="compact-meta"><input aria-label="日付" id="date" type="date" value="${escapeHTML(state.date)}"><input aria-label="ゴルフ場" id="place" placeholder="ゴルフ場名" maxlength="100" value="${escapeHTML(state.place)}"></div><div class="compact-status"><span>${x.done}/18H 記録済</span><strong>${x.done?x.score:'—'} 打</strong><span>OB ${x.teeOB+x.lateOB}</span></div></section><section class="surface compact-editor" id="hole-editor"><div class="compact-heading"><button class="compact-arrow" data-action="prev" ${state.active===0?'disabled':''}>‹</button><div class="compact-hole"><b>${state.active+1}H</b><span>PAR ${[3,4,5].map(p=>`<button class="mini-par ${h.par===p?'active':''}" data-par="${p}">${p}</button>`).join('')}</span></div><div class="compact-score"><b>${s===null?'—':s}</b><small>${s===null?'合計打数':sgn(s-h.par)}</small></div><button class="compact-arrow" data-action="next">›</button></div><div class="compact-progress">${state.holes.map((hole,i)=>`<button aria-label="${i+1}H" class="progress-dot ${i===state.active?'current':''} ${score(hole)!==null?'done':''}" data-hole="${i}">${i+1}</button>`).join('')}</div>${compactCounter('long','① 50y以内まで',h.long,[1,2,3,4,5,6,7])}${compactCounter('short','② 50y以内 → ON',h.short,[0,1,2,3,4,5],h.direct)}${compactCounter('putts','③ パット',h.putts,[0,1,2,3,4,5])}<div class="compact-extras"><button class="compact-toggle ${h.direct?'active':''}" data-action="direct">${h.direct?'✓ ':''}50y超から直接ON</button><div class="compact-ob"><span>OB</span><span>ティー</span><button data-step="-1" data-field="obTee">−</button><b>${h.obTee}</b><button data-step="1" data-field="obTee">＋</button><span>以降</span><button data-step="-1" data-field="obLater">−</button><b>${h.obLater}</b><button data-step="1" data-field="obLater">＋</button></div></div><button class="compact-next" data-action="next">${state.active===17?'集計を見る':'保存して次のホール →'}</button><p class="compact-hint">自動保存 · OB罰打は①②の打数に含め、OB欄では重複加算しません。</p></section>`}
function compactCounter(field,title,value,quick,disabled=false){return `<div class="compact-counter"><div class="compact-label"><b>${title}</b><strong>${fmt(value)}</strong></div><div class="compact-choices">${quick.map(v=>`<button class="${value===v?'active':''}" data-setval="${v}" data-field="${field}" ${disabled?'disabled':''}>${v}</button>`).join('')}<button class="compact-plus" data-step="1" data-field="${field}" ${disabled?'disabled':''}>＋</button></div></div>`}
function counter(field,title,hint,value,quick,disabled=false){return `<div class="counter-card ${disabled?'dimmed':''}"><div class="counter-title"><b>${title}</b></div><div class="helper" style="font-size:11px;margin-top:4px">${hint}</div><div class="counter-main"><button aria-label="${title}を1減らす" class="count-button" data-step="-1" data-field="${field}" ${disabled?'disabled':''}>−</button><div class="count-num">${fmt(value)}</div><button aria-label="${title}を1増やす" class="count-button" data-step="1" data-field="${field}" ${disabled?'disabled':''}>+</button></div><div class="quick-values">${quick.map(v=>`<button class="quick-choice ${value===v?'active':''}" data-setval="${v}" data-field="${field}" ${disabled?'disabled':''}>${v}</button>`).join('')}</div></div>`}
function obCounter(field,title,value){return `<div class="ob-card"><b>${title}</b><div class="ob-controls"><button data-step="-1" data-field="${field}" aria-label="${title}のOBを減らす">−</button><strong>${value}</strong><button data-step="1" data-field="${field}" aria-label="${title}のOBを増やす">+</button></div></div>`}
function resultView(){let t=all(),done=t.done===18,target=t.score<=99;return `<div class="result-hero"><span class="muted">ROUND SUMMARY · ${escapeHTML(state.date||'日付未設定')}</span><div class="result-score"><div class="big">${t.done?t.score:'—'}<span class="unit">STROKES</span></div><div class="status-pill">${done?(target?'100切り達成':'100切りまで '+Math.max(0,t.score-99)+' 打'):'入力中 '+t.done+'/18H'}</div></div><p>${escapeHTML(state.place||'ゴルフ場未入力')}　｜　${done?`PAR ${t.par}・${sgn(t.score-t.par)}`:'入力済みのホールのみ合計しています'}</p></div><div class="kpi-grid">${kpi('50yまで',t.long,'目安 40打')}${kpi('50y→ON',t.short,'目安 24打')}${kpi('パット',t.putts,'目安 36打')}${kpi('OB合計',t.teeOB+t.lateOB,'ティー '+t.teeOB+' / 以降 '+t.lateOB)}</div><section class="surface"><div class="section-head"><div><div class="eyebrow">HOLE-BY-HOLE</div><h2>18ホールの記録</h2></div><span class="helper">左右にスクロール不要</span></div>${halfMatrix(0)}${halfMatrix(9)}<div class="breakdowns">${breakdown(0)}${breakdown(9)}</div><div class="section-head" style="margin-top:7px"><div><div class="eyebrow">PERFORMANCE</div><h2>プレー分析</h2></div></div><div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">${kpi('Bogey-on以内',t.bon+' / 18','目安 12 / 18')}${kpi('50y超からON',t.direct,'成功ホール数')}${kpi('50y以内→終了',t.short+t.putts,'目安 60打')}</div>${!done?`<div class="small-warn">未入力が ${18-t.done} ホールあります。集計と画像は途中経過として表示されます。</div>`:''}<div class="actions" style="margin-top:18px"><button class="action primary" data-action="export">▣ 結果画像を作成</button><button class="action" data-view="input">入力に戻る</button></div><p class="subnote">画像は18ホールの詳細と前後半の集計を1枚にまとめます。iPhoneは表示された画像を長押しして「写真に保存」できます。</p></section><div class="notice">元の目安は50打×前後半＝100打です。100切りには99打以下が必要です。スコアは①＋②＋③で算出し、OB欄を別途加算しません。</div>`}
function kpi(label,value,detail){return `<div class="kpi"><span>${label}</span><b>${value}</b><span class="target">${detail}</span></div>`}
function halfMatrix(start){let arr=state.holes.slice(start,start+9),sum=sums(arr);let rows=[['H',arr.map((_,i)=>start+i+1),'head'],['Par',arr.map(h=>h.par),''],['～50y',arr.map(h=>fmt(h.long)),''],['50y→ON',arr.map(h=>fmt(h.short)),''],['Putt',arr.map(h=>fmt(h.putts)),''],['Score',arr.map(h=>fmt(score(h))),'score'],['OB',arr.map(h=>h.obTee+h.obLater),''],['B-on',arr.map(h=>bogeyOn(h)===null?'—':bogeyOn(h)?'✓':'–'),'']];return `<div class="half-section"><div class="half-head"><h3>${start===0?'OUT':'IN'} <span class="helper">${start+1}–${start+9}H</span></h3><strong>${sum.done?sum.score+' 打':'—'} <span class="helper">${sum.done}/9H</span></strong></div><div class="matrix">${rows.map(([label,vals,kind])=>`<div class="matrix-label">${label}</div>${vals.map((v,i)=>`<div class="matrix-cell ${kind} ${(kind==='score'&&finite(score(arr[i]))&&score(arr[i])>arr[i].par+1)?'bad':''} ${v==='—'?'muted':''}">${v}</div>`).join('')}`).join('')}</div></div>`}
function breakdown(start){let x=sums(state.holes.slice(start,start+9));return `<div class="breakdown"><h3>${start===0?'OUT 1–9H':'IN 10–18H'}：${x.done}/9H</h3>${[['50yまで',x.long,20],['50y→ON',x.short,12],['パット',x.putts,18],['スコア',x.score,50]].map(a=>`<div class="bar"><span>${a[0]}</span><b>${a[1]} <span>/ 目安${a[2]}</span></b></div>`).join('')}</div>`}
function changeVal(field,v){let h=state.holes[state.active],max=field==='obTee'||field==='obLater'?9:30;h[field]=Math.max(0,Math.min(max,v));if(field==='short'){h.direct=(h[field]===0);}save();render();}
function goHole(i){state.active=Math.max(0,Math.min(17,i));state.view='input';save();render();document.getElementById('hole-editor')?.scrollIntoView({block:'start',behavior:'instant'});}
elem.addEventListener('input',e=>{if(e.target.id==='date'){state.date=e.target.value;save();}if(e.target.id==='place'){state.place=e.target.value;save();}});
elem.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.view){state.view=d.view;save();render();window.scrollTo(0,0);return;}if(d.hole!==undefined){goHole(+d.hole);return;}let h=state.holes[state.active];if(d.par){h.par=+d.par;save();render();return;}if(d.setval!==undefined&&d.field){changeVal(d.field,+d.setval);return;}if(d.step&&d.field){let val=finite(h[d.field])?h[d.field]:(d.step==='1'?0:1);changeVal(d.field,val+Number(d.step));return;}if(d.action==='direct'){h.direct=!h.direct;if(h.direct)h.short=0;else if(h.short===0)h.short=null;save();render();return;}if(d.action==='prev'){goHole(state.active-1);return;}if(d.action==='next'){if(state.active===17){state.view='result';save();render();window.scrollTo(0,0);}else{goHole(state.active+1);}return;}if(d.action==='export'){exportImage();return;}if(d.action==='reset'){if(confirm('新しいラウンドを始めますか？ 現在の入力はリセットされます。先に結果画像を保存してください。')){state=initial();save();render();window.scrollTo(0,0);}return;}});
function exportImage(){let data=makeImage();let stamp=(state.date||today()).replace(/[^\d-]/g,'');const root=document.getElementById('overlay-root');root.innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><div class="overlay-inner"><div class="overlay-head"><div><h2>ラウンド結果画像</h2><p>iPhone：画像を長押し →「写真に保存」</p></div><button id="close-modal">閉じる ✕</button></div><img src="${data}" alt="18ホールのスコア集計画像"><div class="overlay-footer"><a id="download-img" download="golf-round-${stamp}.png" href="${data}">PNGを保存</a><p>長押し保存が難しい場合は「PNGを保存」をお試しください。</p></div></div></div>`;document.getElementById('close-modal').addEventListener('click',()=>root.replaceChildren());root.querySelector('.overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)root.replaceChildren();});}
function makeImage(){const c=document.createElement('canvas');const W=1200,H=1830;c.width=W;c.height=H;const g=c.getContext('2d');const ink='#15392e',muted='#648071',green='#13795a';g.fillStyle='#f3f7f4';g.fillRect(0,0,W,H);
function rr(x,y,w,h,r,fill){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();}
function txt(t,x,y,size=28,color=ink,weight=600,align='left'){g.fillStyle=color;g.font=`${weight} ${size}px -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(String(t),x,y);}
const t=all();rr(38,38,1124,380,30,ink);txt('ROUNDNOTE  /  GOLF SCORECARD',78,104,24,'#b8e3d0',850);txt(state.date||'日付未設定',78,159,29,'#d8ece1',600);let place=state.place||'ゴルフ場 未入力';if(place.length>25)place=place.slice(0,24)+'…';txt(place,78,208,34,'#ffffff',750);txt(t.done?t.score:'—',80,360,150,'#ffffff',850);txt('STROKES',330,353,29,'#c8e0d2',700);let status=t.done===18?(t.score<=99?'100切り 達成':`100切りまで ${t.score-99} 打`):`途中経過 / ${t.done} of 18H`;txt(status,1085,348,31,'#d2efd9',800,'right');txt(t.done===18?`PAR ${t.par}   ${sgn(t.score-t.par)}`:'入力済みホールのみ集計',1085,394,22,'#b4d2c2',500,'right');
let cards=[['50yまで',t.long,'目安40'],['50yからON',t.short,'目安24'],['パット',t.putts,'目安36'],['OB',t.teeOB+t.lateOB,`T ${t.teeOB} / 他 ${t.lateOB}`]];cards.forEach((a,i)=>{let x=38+i*287;rr(x,448,263,153,19,'#ffffff');txt(a[0],x+20,491,21,muted,750);txt(a[1],x+20,561,58,ink,850);txt(a[2],x+246,565,20,muted,600,'right')});
function matrix(start,y){const h=state.holes.slice(start,start+9),s=sums(h);rr(38,y,1124,478,21,'#ffffff');txt(start===0?'OUT / 1–9H':'IN / 10–18H',67,y+57,31,ink,850);txt(`${s.score} 打   /   ${s.done} of 9H`,1126,y+57,26,green,800,'right');let rows=[['Hole',h.map((_,i)=>String(i+1+start))],['Par',h.map(a=>a.par)],['～50y',h.map(a=>fmt(a.long))],['50y→ON',h.map(a=>fmt(a.short))],['Putt',h.map(a=>fmt(a.putts))],['Score',h.map(a=>fmt(score(a)))],['OB',h.map(a=>a.obTee+a.obLater)],['B-on',h.map(a=>bogeyOn(a)===null?'—':bogeyOn(a)?'○':'×')]];const left=66,labelW=170,cellW=97,top=y+83,rowH=44;rows.forEach((row,ri)=>{let ry=top+ri*rowH;rr(left,ry,1056,rowH-3,ri===0?8:4,ri===0?'#e4f0e8':ri===5?'#e3f4e8':ri%2===0?'#f5f8f5':'#ffffff');txt(row[0],left+12,ry+30,22,ri===5?green:muted,ri===5?850:700);row[1].forEach((val,i)=>{txt(val,left+labelW+(i+0.5)*cellW,ry+30,24,ri===5?green:ink,ri===5?850:700,'center')})});txt(`50y以内～終了: ${s.short+s.putts} 打   /   Bogey-on以内: ${s.bon} H`,75,y+459,20,muted,600)}
matrix(0,633);matrix(9,1131);
rr(38,1640,1124,142,20,'#e3f1e7');txt('100切りの目標は 99打以下',68,1698,32,green,900);txt('目安40 + 24 + 36 = 100打。各指標の合計から、さらに1打以上削減。',68,1745,22,ink,550);txt('※ スコア＝50y到達まで＋50yからON＋パット。OB罰打は記録時に含める。',38,1812,20,muted,500);
return c.toDataURL('image/png');}
render();
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
})();
</script>
